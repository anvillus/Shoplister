name: Build & Create release

on:
  push:
    branches: [ setup/pipeline ]

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build APK
        run: |
          cd Shoplister.Mobile
          dotnet publish -c Release -f net9.0-android -o ./output `
            -p:AndroidPackageFormat=apk `
            -p:AndroidKeyStore=false `
            -p:ApplicationId=com.shoplister `
            -p:ApplicationName=Shoplister

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: test-release
          token: ${{ secrets.GH_RELEASE_PAT }}
          files: Shoplister.Mobile/output/*.apk
